<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlashCards">
<link rel="icon" href"icon4.png" type="image/png">
<title>FlashCards</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap');

:root {
  --bg: #F4EFE3;
  --bg2: #FFFFFF;
  --bg3: #E9E1CC;
  --ink: #1A1A1A;

  --red: #D7263D;
  --red-dim: #A11B2C;
  --red-tint: #F6D3D8;

  --yellow: #FFD100;
  --yellow-dim: #D1A800;
  --yellow-tint: #FFF0AD;

  --blue: #1B4F9C;
  --blue-dim: #123A73;
  --blue-tint: #DAE4F3;

  --green: #5C7A42;
  --green-dim: #435A2F;
  --green-tint: #DCE6D0;

  --border: #1A1A1A;
}

* {
  margin:0; padding:0; box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 2.2rem 1.1rem 3.5rem;
  overscroll-behavior: none;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    radial-gradient(circle at 90% 4%, var(--red) 0 46px, transparent 47px),
    radial-gradient(circle at 90% 4%, transparent 0 60px, var(--yellow) 61px, transparent 100px),
    linear-gradient(135deg, var(--blue) 0 100%);
  background-position: 0 0, 0 0, -12% 96%;
  background-size: 100% 100%, 100% 100%, 220px 220px;
  background-repeat: no-repeat;
  opacity: 0.13;
  pointer-events:none; z-index:0;
}

.header { text-align: center; margin-bottom: 1.3rem; z-index: 1; }
.label-top { font-weight: 800; letter-spacing: 0.24em; font-size: 1.3rem; text-transform: uppercase; margin-bottom: 0.3rem; }
.label-sub { font-size: 0.58rem; letter-spacing: 0.28em; color: rgba(26,26,26,0.42); text-transform: uppercase; }
.bauhaus-mark { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.7rem; }
.mark-circle { width: 16px; height: 16px; border-radius: 50%; background: var(--red); }
.mark-square { width: 14px; height: 14px; background: var(--yellow); transform: rotate(45deg); }
.mark-triangle { width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 16px solid var(--blue); }

.app-wrap { z-index: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1rem; }

.screen { display: none; flex-direction: column; gap: 1rem; }
.screen.active { display: flex; }

/* ── NAV BAR ── */
.nav-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
  background: var(--bg2); border: 3px solid var(--border); box-shadow: 4px 4px 0 var(--ink);
  padding: 0.6rem 0.7rem;
}
.nav-btn {
  width: 40px; height: 40px; border: 3px solid var(--border); background: var(--bg2);
  font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.nav-btn:active { background: var(--bg3); }
.nav-label { font-weight: 800; font-size: 1.02rem; letter-spacing: 0.02em; text-align: center; flex: 1; word-break: break-word; }
.nav-tag { display: block; font-size: 0.52rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red-dim); margin-top: 0.15rem; }

/* ── CARD ── */
.card { position: relative; width: 100%; background: var(--bg2); border: 3px solid var(--border); padding: 1.1rem 1.1rem 1.15rem; box-shadow: 4px 4px 0 var(--ink); }
.card::before { content: ''; position: absolute; top: -3px; left: -3px; right: -3px; height: 6px; background: var(--accent, var(--red)); }
.card-accent-red { --accent: var(--red); }
.card-accent-blue { --accent: var(--blue); }
.card-accent-yellow { --accent: var(--yellow); }
.card-accent-green { --accent: var(--green); }

.section-title { display: flex; align-items: center; gap: 0.5rem; font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 800; margin-bottom: 0.7rem; }
.section-title::before { content: ''; width: 10px; height: 10px; background: var(--accent, var(--red)); flex-shrink: 0; }

.field-label { font-size: 0.56rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(26,26,26,0.42); margin-bottom: 0.35rem; }

.text-input {
  width: 100%; font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 600;
  padding: 0.65rem 0.7rem; border: 3px solid var(--border); background: var(--bg2);
  color: var(--ink); -webkit-user-select: text; user-select: text; appearance: none; -webkit-appearance: none;
}
.text-input:focus { outline: none; border-color: var(--red); }
.card-textarea { min-height: 62px; resize: vertical; line-height: 1.35; }

.btn {
  font-family: 'Poppins', sans-serif; font-size: 0.76rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; padding: 0.75rem 0;
  cursor: pointer; border: 3px solid var(--border); background: var(--bg2); color: var(--ink);
  width: 100%; text-align: center;
}
.btn:active { background: var(--bg3); }
.btn.btn-primary { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 4px 4px 0 var(--ink); }
.btn.btn-primary:active { background: var(--red-dim); box-shadow: 1px 1px 0 var(--ink); }
.btn.disabled { opacity: 0.4; pointer-events: none; }

.note-text { font-size: 0.62rem; letter-spacing: 0.02em; line-height: 1.5; color: rgba(26,26,26,0.55); text-align: center; margin-top: 0.2rem; }

/* ── FOLDER COLOR PICKER ── */
.color-picker { display: flex; gap: 0.55rem; margin-bottom: 0.9rem; }
.color-swatch { position: relative; width: 34px; height: 34px; border: 3px solid var(--border); cursor: pointer; flex-shrink: 0; }
.color-swatch.sw-red { background: var(--red); }
.color-swatch.sw-blue { background: var(--blue); }
.color-swatch.sw-yellow { background: var(--yellow); }
.color-swatch.sw-green { background: var(--green); }
.color-swatch.active::after { content: '\2713'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 1rem; }
.color-swatch.sw-yellow.active::after { color: var(--ink); }

/* ── FOLDER GRID ── */
.folder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.folder-tile {
  position: relative; border: 3px solid var(--border); background: var(--bg2); box-shadow: 4px 4px 0 var(--ink);
  padding: 0.9rem 0.8rem 0.8rem; cursor: pointer; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between;
}
.folder-tile:active { box-shadow: 1px 1px 0 var(--ink); }
.folder-tile::before { content: ''; position: absolute; top: -3px; left: -3px; right: -3px; height: 6px; background: var(--tile-accent, var(--red)); }
.folder-tile.fc-red { --tile-accent: var(--red); }
.folder-tile.fc-blue { --tile-accent: var(--blue); }
.folder-tile.fc-yellow { --tile-accent: var(--yellow); }
.folder-tile.fc-green { --tile-accent: var(--green); }
.folder-tile-icon { width: 20px; height: 20px; background: var(--tile-accent, var(--red)); }
.folder-tile-name { font-weight: 800; font-size: 0.85rem; margin-top: 0.55rem; word-break: break-word; }
.folder-tile-count { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.06em; color: rgba(26,26,26,0.5); margin-top: 0.2rem; text-transform: uppercase; }
.folder-tile-del {
  position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border: 2px solid var(--border);
  background: var(--bg2); font-weight: 800; font-size: 0.7rem; cursor: pointer;
}
.folder-empty { grid-column: 1 / -1; text-align: center; font-size: 0.72rem; color: rgba(26,26,26,0.45); padding: 1.1rem 0; }

/* ── CARD LIST (inside a folder) ── */
.card-list { display: flex; flex-direction: column; gap: 0.5rem; }
.card-list-item { position: relative; display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.6rem 0.7rem; border: 2px solid var(--border); background: var(--bg3); }
.cli-text { flex: 1; min-width: 0; }
.cli-front { font-size: 0.78rem; font-weight: 800; word-break: break-word; }
.cli-back { font-size: 0.68rem; font-weight: 600; color: rgba(26,26,26,0.6); margin-top: 0.15rem; word-break: break-word; }
.cli-del { flex-shrink: 0; width: 24px; height: 24px; border: 2px solid var(--border); background: var(--bg2); font-weight: 800; font-size: 0.75rem; cursor: pointer; }
.cli-del:active { background: var(--red-tint); border-color: var(--red); color: var(--red-dim); }
.card-list-empty { font-size: 0.7rem; color: rgba(26,26,26,0.5); text-align: center; padding: 0.5rem 0; }

/* ── STUDY MODE ── */
.flip-stage { perspective: 1300px; margin: 0.3rem 0 0.1rem; }
.flip-card {
  position: relative; width: 100%; height: 280px; cursor: pointer;
  transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(.2,.7,.3,1);
}
.flip-card.flipped { transform: rotateY(180deg); }
.flip-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 3px solid var(--border); box-shadow: 4px 4px 0 var(--ink);
  display: flex; align-items: center; justify-content: center; text-align: center; padding: 1.6rem;
  font-weight: 700; font-size: 1.15rem; line-height: 1.4; word-break: break-word; overflow-y: auto;
}
.flip-front { background: var(--bg2); color: var(--ink); }
.flip-back { background: var(--ink); color: #fff; transform: rotateY(180deg); }
.study-nav { display: flex; gap: 0.6rem; }
</style>
</head>
<body>

<div class="header">
  <div class="label-top">FlashCards</div>
  <div class="label-sub">folders &middot; study &middot; flip to reveal</div>
  <div class="bauhaus-mark"><span class="mark-circle"></span><span class="mark-square"></span><span class="mark-triangle"></span></div>
</div>

<div class="app-wrap">

  <!-- ══ SCREEN 1 — FOLDERS ══ -->
  <div class="screen active" id="screen-folders">
    <div class="card card-accent-blue">
      <div class="section-title">New Folder</div>
      <input type="text" id="folder-name-input" class="text-input" placeholder="Folder name" maxlength="40" style="margin-bottom:0.7rem;">
      <div class="color-picker" id="folder-color-picker">
        <button type="button" class="color-swatch sw-red active" onclick="pickFolderColor('red', this)"></button>
        <button type="button" class="color-swatch sw-blue" onclick="pickFolderColor('blue', this)"></button>
        <button type="button" class="color-swatch sw-yellow" onclick="pickFolderColor('yellow', this)"></button>
        <button type="button" class="color-swatch sw-green" onclick="pickFolderColor('green', this)"></button>
      </div>
      <button class="btn btn-primary" onclick="createFolder()">Create folder</button>
    </div>

    <div class="folder-grid" id="folder-grid"></div>
    <div class="note-text">Tap a folder to open it. Tap &times; to delete a folder and its cards.</div>
  </div>

  <!-- ══ SCREEN 2 — INSIDE A FOLDER ══ -->
  <div class="screen" id="screen-folder">
    <div class="nav-bar">
      <button class="nav-btn" onclick="showScreen('folders')">&larr;</button>
      <div>
        <div class="nav-label" id="folder-title">&mdash;</div>
        <span class="nav-tag" id="folder-count-tag">&mdash;</span>
      </div>
      <button class="nav-btn" onclick="deleteCurrentFolder()">&times;</button>
    </div>

    <div class="card card-accent-yellow">
      <div class="section-title">Add Card</div>
      <div class="field-label">Front</div>
      <textarea id="card-front-input" class="text-input card-textarea" maxlength="200" placeholder="Question or term"></textarea>
      <div class="field-label" style="margin-top:0.6rem;">Back</div>
      <textarea id="card-back-input" class="text-input card-textarea" maxlength="200" placeholder="Answer or definition"></textarea>
      <button class="btn btn-primary" style="margin-top:0.7rem;" onclick="addCard()">Add card</button>
    </div>

    <button class="btn btn-primary" id="study-btn" onclick="startStudy()">Study this folder</button>

    <div class="card card-accent-red">
      <div class="section-title">Cards</div>
      <div class="card-list" id="card-list"></div>
    </div>
  </div>

  <!-- ══ SCREEN 3 — STUDY MODE ══ -->
  <div class="screen" id="screen-study">
    <div class="nav-bar">
      <button class="nav-btn" onclick="exitStudy()">&larr;</button>
      <div>
        <div class="nav-label" id="study-folder-title">&mdash;</div>
        <span class="nav-tag" id="study-progress">&mdash;</span>
      </div>
      <button class="nav-btn" onclick="shuffleStudy()">&#8635;</button>
    </div>

    <div class="flip-stage">
      <div class="flip-card" id="flip-card" onclick="flipCard()">
        <div class="flip-face flip-front" id="flip-front-text"></div>
        <div class="flip-face flip-back" id="flip-back-text"></div>
      </div>
    </div>
    <div class="note-text">Tap the card to flip it.</div>

    <div class="study-nav">
      <button class="btn" onclick="prevCard()">&larr; Prev</button>
      <button class="btn" onclick="nextCard()">Next &rarr;</button>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════
//  AUDIO — a natural click sound on every button / tappable tile,
//  plus a distinct flip "swoosh" for turning a card over.
//  iOS Safari suspends (or "interrupts") the AudioContext whenever
//  the app is backgrounded, so we re-arm it on every route back in.
// ══════════════════════════════════════════════════════
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx || audioCtx.state === 'closed') audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
let clickNoiseBuffer = null;
function getClickNoiseBuffer(ctx) {
  if (!clickNoiseBuffer) {
    const len = Math.floor(ctx.sampleRate * 0.03);
    clickNoiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = clickNoiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
  }
  return clickNoiseBuffer;
}
function playButtonClickSound() {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended' || ctx.state === 'interrupted') ctx.resume();
    const now = ctx.currentTime;
    const noise = ctx.createBufferSource();
    noise.buffer = getClickNoiseBuffer(ctx);
    const bandpass = ctx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.setValueAtTime(2600, now);
    bandpass.Q.value = 0.9;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.5, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.022);
    noise.connect(bandpass).connect(noiseGain).connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.03);

    const thock = ctx.createOscillator();
    const thockGain = ctx.createGain();
    thock.type = 'sine';
    thock.frequency.setValueAtTime(180, now);
    thock.frequency.exponentialRampToValueAtTime(90, now + 0.02);
    thockGain.gain.setValueAtTime(0.16, now);
    thockGain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
    thock.connect(thockGain).connect(ctx.destination);
    thock.start(now); thock.stop(now + 0.03);
  } catch (e) {}
}
function playFlipSound() {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended' || ctx.state === 'interrupted') ctx.resume();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(560, now);
    osc.frequency.exponentialRampToValueAtTime(170, now + 0.15);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.17, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.17);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.18);
  } catch (e) {}
}
// Delegate to every button and every tappable folder tile so nothing is missed.
document.addEventListener('click', function (e) {
  if (e.target.closest('button, .folder-tile')) playButtonClickSound();
}, true);

function resumeAudioIfNeeded() {
  if (audioCtx && (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted')) {
    audioCtx.resume().catch(() => {});
  }
}
// Cover every way iOS can hand the page back to us: switching apps,
// the tab regaining focus, or Safari restoring it from the app switcher.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resumeAudioIfNeeded(); });
window.addEventListener('pageshow', resumeAudioIfNeeded);
window.addEventListener('focus', resumeAudioIfNeeded);
document.addEventListener('touchstart', resumeAudioIfNeeded, { passive: true });

function uid() { return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function escapeHTML(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

// ══════════════════════════════════════════════════════
//  STORAGE — folders: [{id,name,color}], cards: { folderId: [{id,front,back}] }
// ══════════════════════════════════════════════════════
const FOLDERS_KEY = 'flashFoldersV1';
const CARDS_KEY = 'flashCardsV1';
function loadFolders() { try { return JSON.parse(localStorage.getItem(FOLDERS_KEY)) || []; } catch (e) { return []; } }
function saveFolders(f) { try { localStorage.setItem(FOLDERS_KEY, JSON.stringify(f)); } catch (e) {} }
function loadCards() { try { return JSON.parse(localStorage.getItem(CARDS_KEY)) || {}; } catch (e) { return {}; } }
function saveCards(c) { try { localStorage.setItem(CARDS_KEY, JSON.stringify(c)); } catch (e) {} }
let allFolders = loadFolders();
let allCards = loadCards();
let currentFolderId = null;
let pickedColor = 'red';

// ══════════════════════════════════════════════════════
//  SCREENS
// ══════════════════════════════════════════════════════
function showScreen(name) {
  document.getElementById('screen-folders').classList.toggle('active', name === 'folders');
  document.getElementById('screen-folder').classList.toggle('active', name === 'folder');
  document.getElementById('screen-study').classList.toggle('active', name === 'study');
  if (name === 'folders') renderFolders();
}

// ══════════════════════════════════════════════════════
//  FOLDERS
// ══════════════════════════════════════════════════════
function pickFolderColor(color, btn) {
  pickedColor = color;
  document.querySelectorAll('#folder-color-picker .color-swatch').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
}
function createFolder() {
  const input = document.getElementById('folder-name-input');
  const name = input.value.trim();
  if (!name) return;
  const folder = { id: uid(), name, color: pickedColor };
  allFolders.push(folder);
  allCards[folder.id] = [];
  saveFolders(allFolders); saveCards(allCards);
  input.value = '';
  renderFolders();
}
function deleteFolder(id) {
  if (!confirm('Delete this folder and all its cards?')) return;
  allFolders = allFolders.filter(f => f.id !== id);
  delete allCards[id];
  saveFolders(allFolders); saveCards(allCards);
  renderFolders();
}
function deleteCurrentFolder() {
  if (!currentFolderId) return;
  const wasDeleted = confirm('Delete this folder and all its cards?');
  if (!wasDeleted) return;
  allFolders = allFolders.filter(f => f.id !== currentFolderId);
  delete allCards[currentFolderId];
  saveFolders(allFolders); saveCards(allCards);
  showScreen('folders');
}
function renderFolders() {
  if (!allFolders.length) {
    document.getElementById('folder-grid').innerHTML = `<div class="folder-empty">No folders yet &mdash; create one above.</div>`;
    return;
  }
  document.getElementById('folder-grid').innerHTML = allFolders.map(f => {
    const count = (allCards[f.id] || []).length;
    return `<div class="folder-tile fc-${f.color}" onclick="openFolder('${f.id}')">
      <button class="folder-tile-del" onclick="event.stopPropagation();deleteFolder('${f.id}')">&times;</button>
      <span class="folder-tile-icon"></span>
      <div>
        <div class="folder-tile-name">${escapeHTML(f.name)}</div>
        <div class="folder-tile-count">${count} card${count === 1 ? '' : 's'}</div>
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════
//  INSIDE A FOLDER
// ══════════════════════════════════════════════════════
function openFolder(id) {
  currentFolderId = id;
  showScreen('folder');
  renderFolder();
}
function addCard() {
  const frontInput = document.getElementById('card-front-input');
  const backInput = document.getElementById('card-back-input');
  const front = frontInput.value.trim();
  const back = backInput.value.trim();
  if (!front && !back) return;
  if (!allCards[currentFolderId]) allCards[currentFolderId] = [];
  allCards[currentFolderId].push({ id: uid(), front, back });
  saveCards(allCards);
  frontInput.value = ''; backInput.value = '';
  renderFolder();
}
function deleteCard(folderId, cardId) {
  allCards[folderId] = (allCards[folderId] || []).filter(c => c.id !== cardId);
  saveCards(allCards);
  renderFolder();
}
function renderFolder() {
  const folder = allFolders.find(f => f.id === currentFolderId);
  if (!folder) { showScreen('folders'); return; }
  const cards = allCards[currentFolderId] || [];
  document.getElementById('folder-title').textContent = folder.name;
  document.getElementById('folder-count-tag').textContent = `${cards.length} card${cards.length === 1 ? '' : 's'}`;

  const studyBtn = document.getElementById('study-btn');
  studyBtn.classList.toggle('disabled', cards.length === 0);

  document.getElementById('card-list').innerHTML = cards.length
    ? cards.map(c => `<div class="card-list-item">
        <div class="cli-text"><div class="cli-front">${escapeHTML(c.front) || '&mdash;'}</div><div class="cli-back">${escapeHTML(c.back) || '&mdash;'}</div></div>
        <button class="cli-del" onclick="deleteCard('${currentFolderId}','${c.id}')">&times;</button>
      </div>`).join('')
    : `<div class="card-list-empty">No cards yet &mdash; add one above.</div>`;
}

// ══════════════════════════════════════════════════════
//  STUDY MODE
// ══════════════════════════════════════════════════════
let studyOrder = [];
let studyIdx = 0;
let studyFlipped = false;

function startStudy() {
  const cards = allCards[currentFolderId] || [];
  if (!cards.length) return;
  studyOrder = cards.map((_, i) => i);
  studyIdx = 0;
  studyFlipped = false;
  showScreen('study');
  renderStudy();
}
function renderStudy() {
  const folder = allFolders.find(f => f.id === currentFolderId);
  const cards = allCards[currentFolderId] || [];
  document.getElementById('study-folder-title').textContent = folder ? folder.name : '\u2014';
  document.getElementById('study-progress').textContent = cards.length ? `${studyIdx + 1} / ${cards.length}` : '\u2014';
  const card = cards[studyOrder[studyIdx]];
  document.getElementById('flip-front-text').textContent = card ? card.front : '';
  document.getElementById('flip-back-text').textContent = card ? card.back : '';
  document.getElementById('flip-card').classList.toggle('flipped', studyFlipped);
}
function flipCard() {
  studyFlipped = !studyFlipped;
  document.getElementById('flip-card').classList.toggle('flipped', studyFlipped);
  playFlipSound();
}
function nextCard() {
  if (!studyOrder.length) return;
  studyIdx = (studyIdx + 1) % studyOrder.length;
  studyFlipped = false;
  renderStudy();
}
function prevCard() {
  if (!studyOrder.length) return;
  studyIdx = (studyIdx - 1 + studyOrder.length) % studyOrder.length;
  studyFlipped = false;
  renderStudy();
}
function shuffleStudy() {
  for (let i = studyOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [studyOrder[i], studyOrder[j]] = [studyOrder[j], studyOrder[i]];
  }
  studyIdx = 0;
  studyFlipped = false;
  renderStudy();
}
function exitStudy() {
  showScreen('folder');
  renderFolder();
}

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════
renderFolders();
</script>
